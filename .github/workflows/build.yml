name: Flipper build and protocol tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Native protocol tests
        run: gcc -std=c11 -Wall -Wextra -Werror -o /tmp/gq-test tests/test_protocol.c applications_user/glowquest_flipper/protocol.c && /tmp/gq-test
  fap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ufbt
      - name: Build official SDK FAP
        working-directory: applications_user/glowquest_flipper
        run: ufbt
      - name: Checksum
        run: find . -name '*.fap' -exec sha256sum '{}' \; | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: glowquest-flipper-fap
          path: |
            **/*.fap
            SHA256SUMS
          if-no-files-found: error